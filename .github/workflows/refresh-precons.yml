name: Refresh official precons

on:
  push:
    paths:
      - 'build_precons.py'
      - '.github/workflows/refresh-precons.yml'
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build same-origin precon catalog
        run: python3 build_precons.py

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precons
          if git diff --cached --quiet; then
            echo "Precon catalog is already current."
            exit 0
          fi
          git commit -m "Refresh official precon catalog"
          git pull --rebase origin main
          git push origin HEAD:main
